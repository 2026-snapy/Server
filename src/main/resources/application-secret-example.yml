spring:
  datasource:
    url: jdbc:mysql://localhost:3306/snapy
    username: username
    password: password

jwt:
  secret-key: jwt-secret-key

snapy:
  s3:
    bucket: bucket-name
  cloudfront:
    url: https://changeme.cloudfront.net

google:
  oauth:
    web:
      client-id: your-google-web-client-id
      client-secret: your-google-web-client-secret
      redirect-uri: http://localhost:8080/auth/google/callback
    ios:
      client-id: your-google-ios-client-id

apple:
  oauth:
    team-id: YOUR_TEAM_ID
    key-id: YOUR_KEY_ID
    private-key: |
      -----BEGIN PRIVATE KEY-----
      YOUR_P8_PRIVATE_KEY_CONTENT
      -----END PRIVATE KEY-----
    bundle-id: com.gbsw.snapy
    service-id: com.gbsw.snapy.web
    redirect-uri: https://your-domain.com/auth/apple/callback

frontend:
  url: http://localhost:5173

grpc:
  server:
    host: 127.0.0.1
    port: 5000

apns:
  enabled: false
  production: false
  bundle-id: com.messiofcoding.snapy
  certificate-path: C:/certs/apns.pem
  certificate-password: ""
