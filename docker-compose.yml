services:
  db:
    image: mysql:8.0
    container_name: snapy-db
    networks:
      - snapy-net
    environment:
      TZ: Asia/Seoul
      MYSQL_DATABASE: snapy
      MYSQL_USER: ${SPRING_DATASOURCE_USERNAME}
      MYSQL_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    image: ${APP_IMAGE:-ghcr.io/2026-messi-of-coding/server:latest}
    container_name: snapy-app
    networks:
      - snapy-net
    ports:
      - "8080:8080"
    volumes:
      - /home/ec2-user/snapy-app/certs/apns.pem:/app/certs/apns.pem:ro
      - /home/ec2-user/snapy-app/logs:/app/logs
    env_file:
      - .env
    environment:
      TZ: Asia/Seoul
      LOG_PATH: /app/logs
      SPRING_PROFILES_ACTIVE: deploy
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/snapy?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_CLOUD_AWS_REGION_STATIC: ap-northeast-2
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "false"
      LOGGING_LEVEL_ORG_HIBERNATE_SQL: WARN
      LOGGING_LEVEL_ORG_HIBERNATE_ORM_JDBC_BIND: WARN
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql-data:

networks:
  snapy-net:
    external: true